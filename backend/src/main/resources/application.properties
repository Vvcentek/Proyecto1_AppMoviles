server.port=8080
spring.application.name=mastermartini-eventos

# Base de datos H2 guardada en un archivo (los datos se mantienen al reiniciar)
spring.datasource.url=jdbc:h2:file:./data/mastermartini
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web para ver las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
